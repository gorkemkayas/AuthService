# /etc/nginx/sites-available/auth.kayas.dev
# ln -s ... sites-enabled/  &&  nginx -t && systemctl reload nginx
#
# Port ozeti (host):
#   Ecommerce API      -> 8180  (api.kayas.dev)
#   Ecommerce Frontend -> 3100  (shop.kayas.dev)
#   Auth API           -> 8181  (auth.kayas.dev)
#   Auth Frontend      -> 3101  (panel.kayas.dev veya auth-ui.kayas.dev)
#
# Not: Docker container icinde API 8080 dinler; host'ta 8181'e map edilir.
# Sunucudaki 8080 portu baska uygulama icin kullanilmaya devam edebilir.

server {
    listen 80;
    server_name auth.kayas.dev;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name panel.kayas.dev;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
