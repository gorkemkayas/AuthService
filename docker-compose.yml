services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-AuthServerDb}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-AuthServerDb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - auth-network

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-api
    restart: unless-stopped
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DatabaseConfigurations__AuthDatabase: PostgreSQL
      DatabaseConfigurations__ConnectionString: Host=auth-postgres;Port=5432;Database=${POSTGRES_DB:-AuthServerDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-https://auth.kayas.dev}
      Jwt__Audience: ${JWT_AUDIENCE:-https://auth.kayas.dev}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      ECommerce__ApiBaseUrl: ${ECOMMERCE_API_BASE_URL:-https://api.kayas.dev}
      ECommerce__BaseUrl: ${ECOMMERCE_API_BASE_URL:-https://api.kayas.dev}
      ECommerce__ServiceToken: ${ECOMMERCE_SERVICE_TOKEN:-}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUser: ${EMAIL_SMTP_USER:-}
      Email__SmtpPass: ${EMAIL_SMTP_PASS:-}
      Email__From: ${EMAIL_FROM:-}
    expose:
      - "8080"
    ports:
      - "${AUTH_API_HOST_PORT:-8181}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - auth-network

  auth-frontend:
    build:
      context: ${AUTH_FRONTEND_PATH:-../AuthService-Frontend}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://auth.kayas.dev/api/v1}
    container_name: auth-frontend
    restart: unless-stopped
    depends_on:
      auth-api:
        condition: service_healthy
    expose:
      - "80"
    ports:
      - "${AUTH_FRONTEND_HOST_PORT:-3101}:80"
    networks:
      - auth-network

volumes:
  auth_postgres_data:

networks:
  auth-network:
    driver: bridge
